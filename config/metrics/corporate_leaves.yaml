# Corporate (VAS, Circular 200/2014/TT-BTC) statement leaves.
# Codes are the "Mã số" column; they were checked against the corpus with
# scripts/verify_metric_codes.py (manual, read-only). Costs are printed in
# parentheses in many reports, so derived formulas wrap them in abs().
# The template ("corporate") comes from this file name (ruling R1).

