# Bank (credit institution) statement leaves. Bank statements number lines with
# roman numerals plus locally repeated numbers (ACB 2022: "VI Cho vay khách hàng"
# -> "1 Cho vay khách hàng" -> "2 Dự phòng rủi ro cho vay khách hàng"), so leaves
# carry no codes and are found by label (decision D2): codes: [], at least two
# aliases, and an optional parent naming the section leaf. Aliases were checked
# against the corpus with scripts/verify_metric_codes.py (manual, read-only).
# The template ("bank") comes from this file name (ruling R1).

# ---- income statement ---------------------------------------------------
- id: interest_and_similar_income
  label_vi: Thu nhập lãi và các khoản thu nhập tương tự
  aliases: [thu nhập lãi và các khoản thu nhập tương tự, thu nhập lãi và các khoản tương tự,
            thu nhập lãi và thu nhập tương tự]
  statement_kind: income_statement
  codes: []
  period_kind: flow
  source: statement
  dimension: money

