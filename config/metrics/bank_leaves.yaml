# Section VI "Cho vay khách hàng" prints the same label as its child line 1, and an
# alias can belong to one node only; the plain label belongs to the gross child.
# The section (net of provision) is located by its position (roman numeral row
# that heads the child lines), its own aliases name the net amount.
- id: customer_loans_section
  label_vi: Cho vay khách hàng (thuần, sau dự phòng)
  aliases: [cho vay khách hàng thuần, dư nợ cho vay khách hàng thuần,
            cho vay khách hàng sau dự phòng]
  statement_kind: balance_sheet
  codes: []
  period_kind: closing
  source: statement
  dimension: money

- id: customer_loans_gross
  label_vi: Cho vay khách hàng
  aliases: [cho vay khách hàng, dư nợ cho vay khách hàng, tổng dư nợ cho vay khách hàng]
  statement_kind: balance_sheet
  codes: []
  period_kind: closing
  source: statement
  dimension: money
